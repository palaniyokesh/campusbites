    <script>
       async function fetchMyOrders() {
    try {
        const response = await fetch('/get-my-orders', {
            credentials: 'include' 
        });

        if (response.status === 401) {
            window.location.href = '/login-page';
            return;
        }

        const orders = await response.json();
        const container = document.getElementById('ordersContainer');

        if (orders.length === 0) {
            container.innerHTML = `<div class="no-orders">No orders found. Time to grab some food!</div>`;
            return;
        }

        // Render orders newest first
        container.innerHTML = orders.reverse().map(order => {
            // --- 1. CALCULATE TIME DIFFERENCE ---
            const orderTime = new Date(`${order.date} ${order.time}`);
            const now = new Date();
            const diffInMinutes = Math.floor((now - orderTime) / 1000 / 60);

            // --- 2. DECIDE IF WE SHOW THE CANCEL BUTTON ---
           let cancelBtnHTML = '';
if (order.status === "Pending" && diffInMinutes < 60) {
    cancelBtnHTML = `
        <button class="btn-cancel" onclick="handleCancel('${order.token_id}')">
            <i class="fas fa-trash-can" style="font-size: 0.7rem;"></i> Cancel
        </button>`;
} else if (order.status === "Cancelled") {
    cancelBtnHTML = `<span class="status-cancelled">Voided</span>`;
}

            return `
                <div class="order-card" style="${order.status === 'Cancelled' ? 'opacity: 0.6;' : ''}">
                    <div class="ticket-header">
                        <div>
                            <small style="opacity:0.6">TOKEN ID</small>
                            <div class="token-id">${order.token_id || 'N/A'}</div>
                        </div>
                        <span class="status-badge status-${order.status.toLowerCase()}">
                            ${order.status}
                        </span>
                    </div>
                    
                    <ul class="items-list">
                        ${order.items.map(item => `
                            <li>
                                <span>${item.qty} x ${item.name}</span>
                                <span>₹${item.qty * item.price}</span>
                            </li>
                        `).join('')}
                    </ul>

                    <div class="total-row">
                        Total: ₹${order.total_amount}
                    </div>
                    <div style="font-size: 0.7rem; opacity: 0.5; margin-top: 10px;">
                        Ordered on: ${order.date} at ${order.time}
                    </div>

                    ${cancelBtnHTML}
                </div>
            `;
        }).join('');

    } catch (error) {
        console.error("Error fetching orders:", error);
        document.getElementById('ordersContainer').innerHTML = `<p class="no-orders">Server connection failed.</p>`;
    }
}

// --- 4. THE CANCEL ACTION FUNCTION ---
async function handleCancel(tokenId) {
    if (!confirm("Are you sure you want to cancel this order? It can only be done within 1 hour.")) return;

    try {
        const response = await fetch('/cancel-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include', // <--- ADD THIS LINE HERE
            body: JSON.stringify({ token_id: tokenId })
        });

        const result = await response.json();
        alert(result.message);
        
        if (response.ok) {
            fetchMyOrders(); // Refresh the list to show "Cancelled" status
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Failed to connect to server.");
    }
}

        // Run when page loads
        window.onload = fetchMyOrders;
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            const icon = document.querySelector('.hamburger i');

            // Toggles the bounce animation
            navLinks.classList.toggle('mobile-open');

            // Optional: Switches the bars icon to an 'X' icon
            if (navLinks.classList.contains('mobile-open')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        }
        window.addEventListener('load', () => {
            const overlay = document.getElementById('transitionOverlay');
            // Fade out the overlay once page is ready
            overlay.classList.add('loaded');
        });

        // Intercept all links for a smooth exit animation
        // Intercept all links and buttons for a smooth exit animation
document.querySelectorAll('a, .btn-menu').forEach(link => {
    link.addEventListener('click', function (e) {
        // 1. Determine destination: 
        // If it's a button, we check for a custom link or default to menu.html
        // If it's an <a> tag, we use the href.
        let destination = this.href;
        
        if (this.classList.contains('btn-menu')) {
            destination = '/menu';
        }

        // 2. Only animate if there's a destination and it's not a dummy link (#)
        if (destination && !destination.includes('#')) {
            e.preventDefault(); // Stop the instant jump
            
            const overlay = document.getElementById('transitionOverlay');

            // Play exit animation
            overlay.classList.remove('loaded');
            overlay.classList.add('exit');

            // Wait for animation (500ms) then redirect
            setTimeout(() => {
                window.location.href = destination;
            }, 500);
        }
    });
});

// Function to check if any order is ready
async function checkOrderStatus() {
    const response = await fetch('/get-user-orders'); // Adjust to your route
    const orders = await response.json();

    orders.forEach(order => {
        if (order.status === "Ready" && !order.notified) {
            // 1. Show a Browser Alert
            alert(`Order #${order.token_id} is READY! Please collect it from the counter.`);
            
            // 2. Play a subtle sound (Optional but cool)
            let audio = new Audio('notification.mp3');
            audio.play();

            // Mark as notified so it doesn't alert again
            markOrderAsNotified(order.token_id);
        }
    });
}

// --- Account Management Logic ---

// 1. Check Session & Update Nav
async function checkUserSession() {
    try {
        // We use credentials: 'include' to pass the session cookie
        const response = await fetch('/get-session', {
            method: 'GET',
            credentials: 'include' 
        });
        
        const data = await response.json();

        if (data.logged_in) {
            document.getElementById('userAccountSection').style.display = 'inline-block';
            document.getElementById('navLoginBtn').style.display = 'none';
            document.getElementById('navUserName').innerText = data.user_name;
            document.getElementById('navUserEmail').innerText = data.user_email;
        } else {
            document.getElementById('userAccountSection').style.display = 'none';
            document.getElementById('navLoginBtn').style.display = 'block';
        }
    } catch (error) {
        console.error("Session Error:", error);
    }
}

// 2. Toggle Dropdown visibility
function toggleUserDropdown() {
    const dropdown = document.getElementById('userDropdown');
    dropdown.classList.toggle('show');
}

// 3. Logout User
async function logoutUser() {
    try {
        await fetch('/logout', { 
            method: 'POST',
            credentials: 'include'
        });
        window.location.href = "/login-page";
    } catch (err) {
        alert("Logout failed!");
    }
}

// Close dropdown if clicking outside
window.addEventListener('click', (e) => {
    if (!e.target.closest('.user-account-container')) {
        document.getElementById('userDropdown').classList.remove('show');
    }
});
